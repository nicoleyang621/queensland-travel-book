<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行打包清单</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/screen.css" media="screen">
  <link rel="stylesheet" href="styles/print.css" media="print">
</head>
<body>
  <main class="page-shell packing-page">
    <nav class="day-nav" aria-label="Packing navigation">
      <a href="./">返回总目录</a>
      <a href="full-book.html">打开整本路书</a>
    </nav>
    <header class="packing-hero">
      <figure class="appendix-hero-icon"><img src="assets/ai/icons/packing-list-icon.png" alt="旅行打包清单图标"></figure>
      <div>
        <p>昆士兰三城亲子游</p>
        <h1>旅行打包清单</h1>
        <span>昆士兰三城亲子游出行前检查</span>
        <small>酒店预计有洗衣机和烘干机，衣物按精简版准备。</small>
      </div>
    </header>
    <section class="packing-grid">
      
    <article class="packing-card">
      <h2><span aria-hidden="true">📦</span>证件 &amp; 安全</h2>
      <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>护照（全家）</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>机票确认邮件（截图或打印）</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>酒店、门票预订确认函</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>现金 &amp; 常用银行卡</span>
    </label></div>
      
    </article>
    <article class="packing-card">
      <h2><span aria-hidden="true">👔</span>衣物</h2>
      
      
        <section class="packing-group">
          <h3>小孩</h3>
          <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>短袖 T 恤：4 件</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>短裤：3 条</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>长裤：1 条</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>薄外套 / 连帽衫：1-2 件</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>泳衣：1 套</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>睡衣：2 套</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>内裤：5-6 条</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>袜子：4-5 双</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>帽子：1 顶</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>鞋：运动鞋 1 双 + 可沾水凉鞋/洞洞鞋 1 双</span>
    </label></div>
        </section>
        <section class="packing-group">
          <h3>大人</h3>
          <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>短袖 / 轻薄上衣：3-4 件</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>薄长袖：1 件</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>短裤 / 轻薄裤：2 条</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>长裤 / 休闲裤：1 条</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>薄外套 / 防风外套：1 件</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>泳衣：1 套</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>睡衣：1 套</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>内衣：4-5 套</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>袜子：3-4 双</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>帽子 / 墨镜：各 1</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>鞋：舒服步行鞋 1 双 + 拖鞋/凉鞋 1 双</span>
    </label></div>
        </section>
    </article>
    <article class="packing-card">
      <h2><span aria-hidden="true">🧴</span>小孩必备</h2>
      <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>防晒霜 SPF50+</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>防晒帽 / 水母装</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>小孩潜水镜</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>湿纸/湿巾</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>防虫药</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>玩具（yoto，大ipad，玩沙工具）</span>
    </label></div>
      
    </article>
    <article class="packing-card">
      <h2><span aria-hidden="true">💪</span>健康 &amp; 常备药</h2>
      <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>晕船药</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>腹泻药</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>止痛消炎药（布洛芬 / Panadol）</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>止血贴</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>防晒霜 SPF50+（大人/小孩）</span>
    </label></div>
      
    </article>
    <article class="packing-card">
      <h2><span aria-hidden="true">🔋</span>数码 &amp; 充电</h2>
      <div class="packing-items">
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>手机 &amp; 充电器</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>充电宝</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>相机 &amp; 内存卡</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>儿童耳机</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>插排</span>
    </label>
    <label class="packing-check">
      <span class="print-box" aria-hidden="true"></span>
      <span>防水袋</span>
    </label></div>
      
    </article>
    </section>
    <footer class="page-footer">
      <span>昆士兰三城亲子游</span>
      <span>打包清单</span>
      <span>Page ____</span>
    </footer>
  </main>
</body>
</html>
